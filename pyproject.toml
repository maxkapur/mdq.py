[project]
name = "mdq"
version = "0.1.0"
dependencies = [
    "fastembed-gpu",
    "platformdirs",
    "sqlite-vec",
    "rich",
]
requires-python = ">= 3.13"
authors = [
  {name = "Max Kapur", email = "git@maxkapur.com"},
]
maintainers = [
  {name = "Max Kapur", email = "git@maxkapur.com"},
]
# description = ""
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]

[project.urls]
Homepage = "https://github.com/maxkapur/mdq.py"
Documentation = "https://github.com/maxkapur/mdq.py"
Repository = "https://github.com/maxkapur/mdq.py.git"
"Bug Tracker" = "https://github.com/maxkapur/mdq.py/issues"

[project.scripts]
mdq = "mdq.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
  "uv",
]

[tool.mypy]
files = ["."]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["I"]
